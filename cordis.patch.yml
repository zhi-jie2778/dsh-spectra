# ---------------------------------------------------------------------------
# dsh-ui-beautify — bundle patch
# ---------------------------------------------------------------------------
# Installing this package adds one Loader entry named `ui-beautify`, whose
# Settings document namespace is `ui-beautify`. The entry is inert until the
# user turns the master switch on inside Settings -> 界面美化.
# ---------------------------------------------------------------------------
- insert:
    - id: ui-beautify
      name: dsh-ui-beautify
